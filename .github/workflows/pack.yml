name: Pack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add GitHub Packages source
        run: dotnet nuget add source --username tticmark --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/tticmark/index.json"

      - name: Pack plugin SDK
        run: dotnet pack src/CAD_ET_HANS.Plugin.Abstractions/CAD_ET_HANS.Plugin.Abstractions.csproj -c Release -o nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "nupkg/*.nupkg" --source github --api-key ${{ secrets.GITHUB_TOKEN }}
