name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CAD_ET_HANS.sln

      - name: Build
        run: dotnet build CAD_ET_HANS.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish src/CAD_ET_HANS.App/CAD_ET_HANS.App.csproj -c Release -o publish-ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD_ET_HANS
          path: publish-ci
